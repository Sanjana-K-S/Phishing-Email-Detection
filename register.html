{% load static %}

<!DOCTYPE html>
<html class="h-100" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PHISHING EMAIL</title>
    <!-- Favicon icon -->
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon.png' %}">
    <!-- <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous"> -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
        #input {
            border-bottom: 1px solid rgba(0, 0, 0, 0.414);
            color: black;
        }

        .card {
            background-color: rgb(255, 255, 255);
            margin: 10px;
        }
    </style>


</head>

<body class="h-100">

    <!--*******************
        Preloader start
    ********************-->
    <div id="preloader">
        <div class="loader">
            <svg class="circular" viewBox="25 25 50 50">
                <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="3" stroke-miterlimit="10" />
            </svg>
        </div>
    </div>
    <!--*******************
        Preloader end
    ********************-->





    <div class="login-form-bg h-100">
        <div class="container h-100">
            <div class="row justify-content-center h-100">
                <div class="col-xl-6">
                    <div class="form-input-content">
                        <div class="card login-form mb-0">
                            <div class="card-body pt-5">
                                <h2 class="text-center">REGISTER NOW</h2>
                                <form class="mt-5 mb-5 login-input" method="post" enctype="multipart/form-data">
                                    {% csrf_token %}
                                    <div class="form-group">
                                        <input type="text" id="input" name="name" class="form-control"
                                            placeholder="Name" required>
                                    </div>
                                    <div class="form-group">
                                        <input type="email" id="input" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$"
                                            name="email" class="form-control fa fa-envelope" placeholder="Email"
                                            required>
                                    </div>
                                    <div class="form-group">
                                        <input type="text" id="input" class="form-control" pattern="[9876][0-9]{9}"
                                            maxlength="10" name="phone" placeholder="Phone" required>
                                    </div>
                                    <div class="form-group">
                                        <input type="text" id="input" max="{{current_date}}"
                                            onfocus="(this.type='date')" class="form-control" id="date-format"
                                            name="dob" placeholder="Date Of Birth" required>
                                    </div>
                                    <div class="form-group">
                                        <input type="file" class="form-control l-border-1" name="image" required>
                                    </div>
                                    <div class="form-group">
                                        <p>Select Gender</p>
                                        <input type="radio" id="male" name="gender" value="Male" required>
                                        <label for="male">Male</label>
                                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                                        <input type="radio" id="female" name="gender" value="Female" required>
                                        <label for="female">Female</label>
                                    </div>
                                    <div class="form-group">
                                        <textarea name="address" id="input" class="form-control" id="" cols="30"
                                            placeholder="Address" rows="5"></textarea>
                                    </div>
                                    <div class="form-group">
                                        <input type="password" id="input" name="password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" class="form-control"
                                            placeholder="Password" required>
                                    </div>
                                    <button class="btn login-form__btn submit w-100">Sign Up</button>
                                </form>
                                <p class="mt-5 login-form__footer">Already Have an account ? <a href="/login"
                                        class="text-primary"><b> Sign In </b></a> now</p>
                                </p>
                                <a href="/"
                                        class="btn btn-outlin-secondary">Home</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>





    <!--**********************************
        Scripts
    ***********************************-->
    <script src="{% static 'plugins/common/common.min.js' %}"></script>
    <script src="{% static 'js/custom.min.js' %}"></script>
    <script src="{% static 'js/settings.js' %}"></script>
    <script src="{% static 'js/gleek.js' %}"></script>
    <script src="{% static 'js/styleSwitcher.js' %}"></script>

    <script type="text/javascript">
        $(document).ready(function () {
            $('#date').bootstrapMaterialDatePicker
                ({
                    time: false,
                    clearButton: true
                });

            $('#time').bootstrapMaterialDatePicker
                ({
                    date: false,
                    shortTime: false,
                    format: 'HH:mm'
                });

            $('#date-format').bootstrapMaterialDatePicker
                ({
                    format: 'dddd DD MMMM YYYY - HH:mm'
                });
            $('#date-fr').bootstrapMaterialDatePicker
                ({
                    format: 'DD/MM/YYYY HH:mm',
                    lang: 'fr',
                    weekStart: 1,
                    cancelText: 'ANNULER',
                    nowButton: true,
                    switchOnClick: true
                });

            $('#date-end').bootstrapMaterialDatePicker
                ({
                    weekStart: 0, format: 'DD/MM/YYYY HH:mm'
                });
            $('#date-start').bootstrapMaterialDatePicker
                ({
                    weekStart: 0, format: 'DD/MM/YYYY HH:mm', shortTime: true
                }).on('change', function (e, date) {
                    $('#date-end').bootstrapMaterialDatePicker('setMinDate', date);
                });

            $('#min-date').bootstrapMaterialDatePicker({ format: 'DD/MM/YYYY HH:mm', minDate: new Date() });

            $.material.init()
        });
    </script>
</body>

</html>
